name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (real bugs only)
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # Hooks favour portable one-liners (ls|head, etc.); fail only on genuine
          # bugs (severity=error), not style/info nits.
          SHELLCHECK_OPTS: --severity=error
        with:
          scandir: '.'
          additional_files: 'post-merge'

      - name: bash -n (parse check, all scripts)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(find . -type f \( -name '*.sh' -o -path './scripts/git-hooks/*' \) -print0)
          exit $fail

  top-model:
    name: top-model.sh resolves every plan shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: synthetic profiles -> expected alias
        run: |
          t="$(mktemp -d)"; mkdir -p "$t/proj/.claude"
          printf '> Top model policy: `TOP_MODEL = auto`\n' > "$t/proj/CLAUDE.md"
          mk() { printf '{"numStartups":1,"oauthAccount":{"emailAddress":"x@y","organizationType":"%s","organizationRateLimitTier":"%s","seatTier":%s}}\n' "$1" "$2" "$3" > "$t/$4.json"; }
          mk claude_max        default_claude_max_20x   null        max20
          mk claude_max        default_claude_max_5x    null        max5
          mk claude_pro        default_claude_pro       null        pro
          mk claude_team       default_claude_team      '"standard"' teamstd
          mk claude_enterprise default_claude_enterprise '"premium"' entprem
          printf '{"numStartups":1}\n' > "$t/none.json"
          printf 'not json at all\n'   > "$t/garbage.json"
          fail=0
          expect() { # expect <profile> <alias> [env...]
            got="$(env "${@:3}" CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/$1.json" bash scripts/top-model.sh)"
            if [ "$got" = "$2" ]; then echo "  ok    $1 -> $got"; else echo "::error::$1 resolved to '$got', expected '$2'"; fail=1; fi
          }
          expect max20   fable
          expect max5    fable
          expect pro     opus
          expect teamstd opus
          expect entprem fable
          expect none    opus
          expect garbage opus
          expect max20   opus  VULYK_TOP_MODEL=opus
          expect pro     fable VULYK_TOP_MODEL=fable
          # the constitution pin beats the plan; `auto` defers to it
          printf '> Top model policy: `TOP_MODEL = opus`\n' > "$t/proj/CLAUDE.md"
          expect max20 opus
          printf '> Top model policy: `TOP_MODEL = auto`\n' > "$t/proj/CLAUDE.md"
          expect max20 fable
          # --check is red before --apply and green after; --apply merges into an existing file
          CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/max20.json" bash scripts/top-model.sh --check && { echo "::error::--check passed with no pin"; fail=1; }
          printf '{"permissions":{"allow":["Bash(ls:*)"]}}\n' > "$t/proj/.claude/settings.local.json"
          CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/max20.json" bash scripts/top-model.sh --apply
          CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/max20.json" bash scripts/top-model.sh --check || { echo "::error::--check failed after --apply"; fail=1; }
          grep -q '"Bash(ls:\*)"' "$t/proj/.claude/settings.local.json" || { echo "::error::--apply lost the owner's permissions"; fail=1; }
          grep -q '"model": "fable"' "$t/proj/.claude/settings.local.json" || { echo "::error::--apply did not pin fable"; fail=1; }
          # the hook says the same thing in one line, and says nothing where the resolver is absent
          mkdir -p "$t/proj/scripts" && cp scripts/top-model.sh "$t/proj/scripts/"
          line="$(CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/pro.json" bash .claude/hooks/top-model-brief.sh)"
          echo "$line" | grep -q '^\[VULYK\] top model: opus' || { echo "::error::hook line wrong: $line"; fail=1; }
          rm "$t/proj/scripts/top-model.sh"
          [ -z "$(CLAUDE_PROJECT_DIR="$t/proj" bash .claude/hooks/top-model-brief.sh)" ] || { echo "::error::hook spoke without a resolver"; fail=1; }
          # the hook never spawns the CLI for the Workflow line - a fake `claude` on PATH must sit untouched
          mkdir -p "$t/proj/scripts" "$t/fakebin"
          cp scripts/top-model.sh "$t/proj/scripts/"
          sentinel="$t/fakebin/claude-was-called"
          printf '#!/usr/bin/env bash\ntouch "%s"\necho "2.1.154"\n' "$sentinel" > "$t/fakebin/claude"
          chmod +x "$t/fakebin/claude"
          line2="$(PATH="$t/fakebin:$PATH" CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/pro.json" bash .claude/hooks/top-model-brief.sh)"
          [ -f "$sentinel" ] && { echo "::error::hook spawned the fake claude CLI"; fail=1; }
          echo "$line2" | grep -q 'Workflow driver:' || { echo "::error::hook line missing Workflow driver: $line2"; fail=1; }
          echo "$line2" | grep -q 'CLI' && { echo "::error::hook line still mentions CLI: $line2"; fail=1; }
          rm -f "$t/proj/scripts/top-model.sh"
          exit $fail

  cycle:
    name: the cycle's gates - human-check.sh and ship-check.sh through every stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: synthetic spec -> six confirmations, stale on code, current on paperwork
        run: bash tests/cycle.test.sh

  council:
    name: the council's verdict machinery - cycle.sh judge/escalate over hand-written fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fixture rounds -> GREEN, RED, ESCALATE (ceiling/half/env), N/A, owner override
        run: bash tests/council.test.sh

  handoff-window:
    name: handoff.py resolves the context window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: synthetic windows -> right denominator, right silence
        run: python3 tests/handoff-window.test.py .claude/hooks/handoff.py

  driver:
    name: the Workflow driver executes for real against stubbed agent/parallel/clerk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: real parse, real foldReviews, stubbed loop scenarios
        run: bash tests/driver.test.sh

  telemetry-inbox:
    name: telemetry.sh suite + check every inbox bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: telemetry.sh test suite
        run: bash tests/telemetry.test.sh

      - name: check every telemetry/inbox bundle (green with none present)
        run: |
          shopt -s nullglob globstar
          files=(telemetry/inbox/**/*.jsonl)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no bundles in telemetry/inbox - nothing to check"
          else
            bash scripts/telemetry.sh check "${files[@]}"
          fi

  install-smoke:
    name: install.sh dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: plant dummy runtime artifacts (must never be shipped, per shippable())
        run: |
          mkdir -p .claude/handoff memory/snapshots/2026
          # a sentinel, not a plausible model name: top-model.sh --apply legitimately
          # creates its OWN settings.local.json in the target later in the run (story 07),
          # so the file existing afterward is expected - only this literal content leaking
          # in would mean copy_tree shipped the maintainer's file instead of skipping it.
          echo '{"model":"__vulyk_smoke_leak_marker__"}' > .claude/settings.local.json
          echo 'dummy handoff'                           > .claude/handoff/x.md
          echo '{}'                                       > .claude/state.json
          echo 'dummy snapshot'                           > memory/snapshots/2026/x.md
          echo 'BOGUS-VERSION'                            > .claude/vulyk-version
          mkdir -p memory/stats
          echo '{"v":1,"code":"context_high"}' > memory/stats/anomalies.jsonl

      - name: install --check into a clean dir is non-destructive and well-formed
        run: |
          target="$(mktemp -d)"
          out="$(./install.sh "$target" --check)"
          echo "$out"
          # dry run must touch nothing
          if [ -n "$(ls -A "$target")" ]; then
            echo "::error::--check wrote files into target (should be dry run)"; exit 1
          fi
          # and must plan to copy the load-bearing pieces
          for needle in ".claude/commands/vulyk-plan.md" ".claude/agents/queen-planner.md" "memory/memory.md"; do
            echo "$out" | grep -q "$needle" || { echo "::error::--check did not plan to copy $needle"; exit 1; }
          done
          # and must show it would skip the maintainer's own runtime artifacts, not ship them
          echo "$out" | grep -q "would skip (runtime) .claude/settings.local.json" || { echo "::error::--check did not report skipping settings.local.json"; exit 1; }
          # ADR-005 D4.1: vulyk's own ADRs/wiki are never planned to ship
          echo "$out" | grep -q "would copy.*docs/adr/" && { echo "::error::--check planned to copy docs/adr/"; exit 1; }
          echo "$out" | grep -q "would copy.*docs/wiki/" && { echo "::error::--check planned to copy docs/wiki/"; exit 1; }

      - name: real install into a clean dir produces a runnable hive
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          test -f "$target/CLAUDE.md"                          || { echo "::error::CLAUDE.md missing"; exit 1; }
          test -x "$target/.claude/hooks/session-start-brief.sh" || { echo "::error::hooks not executable"; exit 1; }
          test -x "$target/.claude/hooks/top-model-brief.sh"    || { echo "::error::top-model hook missing or not executable"; exit 1; }
          grep -q 'top-model-brief.sh' "$target/.claude/settings.json" || { echo "::error::top-model hook not wired"; exit 1; }
          # wire_permissions must have added both allow rules the clerk needs, each exactly
          # once, or every cycle-clerk dispatch stalls on a prompt nobody is watching (R22).
          jq -e --arg r1 'Bash(bash scripts/cycle.sh:*)' --arg r2 'Bash(bash scripts/journal.sh:*)' \
            '([.permissions.allow[] | select(. == $r1)] | length == 1) and
             ([.permissions.allow[] | select(. == $r2)] | length == 1)' \
            "$target/.claude/settings.json" >/dev/null \
            || { echo "::error::permissions.allow does not contain both cycle.sh and journal.sh allow rules exactly once"; exit 1; }
          test -f "$target/memory/stats/skills.json"           || { echo "::error::skills.json not seeded"; exit 1; }
          # the blanked Profile placeholder must carry every row the source constitution
          # documents (story 16) - count instead of hardcoding a number, so a row added to
          # CLAUDE.md but not to install.sh's placeholder turns this red.
          count_profile_rows() { awk '/<!-- VULYK:PROFILE:START -->/{f=1;next}/<!-- VULYK:PROFILE:END -->/{f=0}f' "$1" | grep -c '^| '; }
          src_rows="$(count_profile_rows CLAUDE.md)"
          tgt_rows="$(count_profile_rows "$target/CLAUDE.md")"
          [ "$src_rows" = "$tgt_rows" ] || { echo "::error::Profile block row count mismatch: source=$src_rows target=$tgt_rows"; exit 1; }
          # never ships the maintainer's own gitignored runtime artifacts. settings.local.json
          # is checked by content, not by absence: top-model.sh --apply (story 07) legitimately
          # writes the target's OWN pin file later in this same install, so the path existing
          # is expected - only the planted sentinel leaking into it would be a real failure.
          if [ -e "$target/.claude/settings.local.json" ]; then
            grep -q "__vulyk_smoke_leak_marker__" "$target/.claude/settings.local.json" && { echo "::error::shipped the maintainer's settings.local.json"; exit 1; }
          fi
          test ! -e "$target/.claude/handoff/x.md"        || { echo "::error::shipped a handoff file"; exit 1; }
          test ! -e "$target/.claude/state.json"          || { echo "::error::shipped state.json"; exit 1; }
          test ! -e "$target/memory/snapshots/2026/x.md"  || { echo "::error::shipped a snapshot"; exit 1; }
          test ! -e "$target/memory/stats/anomalies.jsonl" || { echo "::error::shipped the maintainer's anomaly log"; exit 1; }
          grep -qx "$(cat VERSION)" "$target/.claude/vulyk-version" || { echo "::error::vulyk-version is not install.sh's own stamp"; exit 1; }
          # ADR-005 D4.1: docs/adr and docs/wiki exist but hold none of vulyk's own numbered ADRs
          test -d "$target/docs/adr"  || { echo "::error::docs/adr not created"; exit 1; }
          test -d "$target/docs/wiki" || { echo "::error::docs/wiki not created"; exit 1; }
          find "$target/docs/adr" -name '001-*.md' | grep -q . && { echo "::error::shipped vulyk's own ADR-001"; exit 1; }
          # ADR-005 K3: the DRIVER semaphore's gitignore entry ships too
          grep -qxF 'docs/specs/*/DRIVER' "$target/.gitignore" || { echo "::error::.gitignore missing docs/specs/*/DRIVER"; exit 1; }
          # ADR-005 D4.2: the manifest exists, is sorted, names only real files, carries a
          # load-bearing agent, and never lists installer state or the constitution.
          test -f "$target/.claude/vulyk-manifest" || { echo "::error::vulyk-manifest not written"; exit 1; }
          LC_ALL=C sort -c "$target/.claude/vulyk-manifest" || { echo "::error::vulyk-manifest is not LC_ALL=C sorted"; exit 1; }
          while IFS= read -r mf; do
            [ -n "$mf" ] || continue
            test -f "$target/$mf" || { echo "::error::vulyk-manifest names missing file: $mf"; exit 1; }
          done < "$target/.claude/vulyk-manifest"
          grep -qxF ".claude/agents/worker-code.md" "$target/.claude/vulyk-manifest" || { echo "::error::vulyk-manifest missing worker-code.md"; exit 1; }
          grep -E 'vulyk-version|vulyk-manifest|^docs/specs/|^docs/adr/0|CLAUDE' "$target/.claude/vulyk-manifest" && { echo "::error::vulyk-manifest lists installer state or the constitution"; exit 1; }
          true

      - name: --upgrade removes a retired OWNED file, --check only reports it (ADR-005 D4.3, D4.11 manifest half)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          echo dummy > "$target/.claude/agents/retired-smoke.md"
          echo ".claude/agents/retired-smoke.md" >> "$target/.claude/vulyk-manifest"
          LC_ALL=C sort -u -o "$target/.claude/vulyk-manifest" "$target/.claude/vulyk-manifest"
          before_manifest="$(cat "$target/.claude/vulyk-manifest")"
          checksum_before="$(find "$target" -type f -exec md5sum {} \; | sort | md5sum)"
          out="$(./install.sh "$target" --upgrade --check)"
          echo "$out" | grep -q "would remove   .claude/agents/retired-smoke.md" || { echo "::error::--check did not report would remove for the retired file"; exit 1; }
          checksum_after="$(find "$target" -type f -exec md5sum {} \; | sort | md5sum)"
          [ "$checksum_before" = "$checksum_after" ] || { echo "::error::--upgrade --check wrote to the target (ADR-005 D4.11)"; exit 1; }
          [ -f "$target/.claude/agents/retired-smoke.md" ] || { echo "::error::--check deleted the retired file"; exit 1; }
          after_manifest="$(cat "$target/.claude/vulyk-manifest")"
          [ "$before_manifest" = "$after_manifest" ] || { echo "::error::--check changed the manifest"; exit 1; }
          out2="$(./install.sh "$target" --upgrade)"
          echo "$out2" | grep -q "remove         .claude/agents/retired-smoke.md" || { echo "::error::real upgrade did not report removing the retired file"; exit 1; }
          test ! -f "$target/.claude/agents/retired-smoke.md" || { echo "::error::real upgrade did not delete the retired file"; exit 1; }
          grep -qxF ".claude/agents/retired-smoke.md" "$target/.claude/vulyk-manifest" && { echo "::error::real upgrade left the retired file in the manifest"; exit 1; }
          true

      - name: --upgrade never removes a file outside OWNED, only reports it (ADR-005 D4.4)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          echo dummy > "$target/memory/retired-smoke.md"
          echo "memory/retired-smoke.md" >> "$target/.claude/vulyk-manifest"
          LC_ALL=C sort -u -o "$target/.claude/vulyk-manifest" "$target/.claude/vulyk-manifest"
          out="$(./install.sh "$target" --upgrade)"
          test -f "$target/memory/retired-smoke.md" || { echo "::error::--upgrade deleted a file outside OWNED"; exit 1; }
          echo "$out" | grep -Ei 'remove.*retired-smoke\.md$' | grep -v 'leave (yours)' && { echo "::error::--upgrade printed a remove line for a file outside OWNED"; exit 1; }
          echo "$out" | grep -q "leave (yours)  memory/retired-smoke.md" || { echo "::error::--upgrade did not report leave (yours) for the dropout"; exit 1; }
          grep -qxF "memory/retired-smoke.md" "$target/.claude/vulyk-manifest" && { echo "::error::the dropout was left in the manifest"; exit 1; }
          true

      - name: --upgrade never lists or removes an owner's own file (ADR-005 D4.5)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          echo mine > "$target/.claude/agents/mine.md"
          before="$(md5sum "$target/.claude/agents/mine.md")"
          ./install.sh "$target" --upgrade >/dev/null
          after="$(md5sum "$target/.claude/agents/mine.md")"
          [ "$before" = "$after" ] || { echo "::error::--upgrade touched an owner's own file"; exit 1; }
          grep -qxF ".claude/agents/mine.md" "$target/.claude/vulyk-manifest" && { echo "::error::an owner's own file was listed in the manifest"; exit 1; }
          true

      - name: --upgrade with no manifest yet keeps every file and reports it, then writes the manifest (ADR-005 D4.6)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          rm -f "$target/.claude/vulyk-manifest"
          echo stale > "$target/.claude/agents/stale-smoke.md"
          out="$(./install.sh "$target" --upgrade)"
          echo "$out" | grep -q "unlisted (kept) .claude/agents/stale-smoke.md" || { echo "::error::--upgrade with no manifest did not report unlisted (kept)"; exit 1; }
          test -f "$target/.claude/agents/stale-smoke.md" || { echo "::error::--upgrade with no manifest deleted a file"; exit 1; }
          test -f "$target/.claude/vulyk-manifest" || { echo "::error::--upgrade with no manifest did not write one"; exit 1; }
          grep -qxF ".claude/agents/stale-smoke.md" "$target/.claude/vulyk-manifest" && { echo "::error::the unlisted file was written into the new manifest"; exit 1; }
          true

      - name: --upgrade into the same target ships no runtime artifact either
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          ./install.sh "$target" --upgrade >/dev/null
          if [ -e "$target/.claude/settings.local.json" ]; then
            grep -q "__vulyk_smoke_leak_marker__" "$target/.claude/settings.local.json" && { echo "::error::--upgrade shipped the maintainer's settings.local.json"; exit 1; }
          fi
          test ! -e "$target/.claude/handoff/x.md"        || { echo "::error::--upgrade shipped a handoff file"; exit 1; }
          test ! -e "$target/.claude/state.json"          || { echo "::error::--upgrade shipped state.json"; exit 1; }
          test ! -e "$target/memory/snapshots/2026/x.md"  || { echo "::error::--upgrade shipped a snapshot"; exit 1; }
          test ! -e "$target/memory/stats/anomalies.jsonl" || { echo "::error::--upgrade shipped the maintainer's anomaly log"; exit 1; }
          grep -qx "$(cat VERSION)" "$target/.claude/vulyk-version" || { echo "::error::--upgrade vulyk-version is not install.sh's own stamp"; exit 1; }
          # the allow rules must still be exactly-once after an upgrade, not duplicated or
          # dropped by a re-run of wire_permissions against an already-wired file (R22).
          jq -e --arg r1 'Bash(bash scripts/cycle.sh:*)' --arg r2 'Bash(bash scripts/journal.sh:*)' \
            '([.permissions.allow[] | select(. == $r1)] | length == 1) and
             ([.permissions.allow[] | select(. == $r2)] | length == 1)' \
            "$target/.claude/settings.json" >/dev/null \
            || { echo "::error::--upgrade left permissions.allow without both cycle.sh and journal.sh allow rules exactly once"; exit 1; }

      - name: --upgrade never touches an already-filled Profile block (except the Telemetry row)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          sed -i 's/| Stack | `<fill in>` |/| Stack | `filled-in-value` |/' "$target/CLAUDE.md"
          before="$(cat "$target/CLAUDE.md")"
          ./install.sh "$target" --upgrade >/dev/null
          after="$(cat "$target/CLAUDE.md")"
          [ "$before" = "$after" ] || { echo "::error::--upgrade modified an already-filled Profile block"; exit 1; }
          # the one permitted exception (A6) still holds to exactly one row, written as `off`
          [ "$(grep -c '^| Telemetry |' "$target/CLAUDE.md")" = "1" ] || { echo "::error::the Telemetry row is not present exactly once"; exit 1; }
          grep -q '^| Telemetry | off ' "$target/CLAUDE.md" || { echo "::error::the Telemetry row is not off by default"; exit 1; }

      - name: --upgrade appends a missing Telemetry row as off, with no terminal and no question
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          sed -i '/^| Telemetry |/d' "$target/CLAUDE.md"
          before="$(grep -v '^| Telemetry |' "$target/CLAUDE.md")"
          out="$(./install.sh "$target" --upgrade)"
          echo "$out" | grep -q "Enable telemetry?" && { echo "::error::the installer asked a question with no terminal"; exit 1; }
          echo "$out" | grep -q "profile row    CLAUDE.md: Telemetry = off" || { echo "::error::--upgrade did not report writing the Telemetry row"; exit 1; }
          [ "$(grep -c '^| Telemetry | off ' "$target/CLAUDE.md")" = "1" ] || { echo "::error::the Telemetry row was not appended exactly once as off"; exit 1; }
          [ "$before" = "$(grep -v '^| Telemetry |' "$target/CLAUDE.md")" ] || { echo "::error::appending the Telemetry row changed another byte of the constitution"; exit 1; }
          # it lands inside the marked block, as its last table row
          awk '/<!-- VULYK:PROFILE:START -->/{f=1;next}/<!-- VULYK:PROFILE:END -->/{f=0}f' "$target/CLAUDE.md" \
            | grep '^| ' | tail -1 | grep -q '^| Telemetry |' || { echo "::error::the Telemetry row is not the last row inside the Profile block"; exit 1; }
          # and a second upgrade leaves it byte-identical
          b2="$(cat "$target/CLAUDE.md")"
          ./install.sh "$target" --upgrade >/dev/null
          [ "$b2" = "$(cat "$target/CLAUDE.md")" ] || { echo "::error::a second --upgrade rewrote the Telemetry row"; exit 1; }

      - name: VULYK_TELEMETRY=on sets the row on a fresh install; --check never writes it
        run: |
          target="$(mktemp -d)"
          VULYK_TELEMETRY=on ./install.sh "$target" >/dev/null
          [ "$(grep -c '^| Telemetry | on ' "$target/CLAUDE.md")" = "1" ] || { echo "::error::VULYK_TELEMETRY=on did not set the row to on"; exit 1; }
          sed -i '/^| Telemetry |/d' "$target/CLAUDE.md"
          before="$(md5sum "$target/CLAUDE.md")"
          out="$(./install.sh "$target" --upgrade --check)"
          [ "$before" = "$(md5sum "$target/CLAUDE.md")" ] || { echo "::error::--check wrote the Telemetry row"; exit 1; }
          echo "$out" | grep -q "would set      CLAUDE.md Profile row: Telemetry" || { echo "::error::--check did not report the pending Telemetry row"; exit 1; }

      - name: --upgrade wires anomaly-scan.sh on Stop and SessionEnd, idempotently
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          jq '.hooks.Stop = [{"hooks":[{"type":"command","command":"$CLAUDE_PROJECT_DIR/.claude/hooks/handoff.sh stop"}]}] | del(.hooks.SessionEnd)' \
            "$target/.claude/settings.json" > "$target/s.json" && mv "$target/s.json" "$target/.claude/settings.json"
          out="$(./install.sh "$target" --upgrade)"
          echo "$out" | grep -q "wire           .claude/settings.json -> Stop: anomaly-scan.sh" || { echo "::error::--upgrade did not wire anomaly-scan.sh on Stop"; exit 1; }
          echo "$out" | grep -q "wire           .claude/settings.json -> SessionEnd: anomaly-scan.sh" || { echo "::error::--upgrade did not wire anomaly-scan.sh on SessionEnd"; exit 1; }
          jq -e '([.hooks.Stop[].hooks[].command | select(test("anomaly-scan.sh"))] | length == 1) and
                 ([.hooks.SessionEnd[].hooks[].command | select(test("anomaly-scan.sh"))] | length == 1) and
                 ([.hooks.Stop[].hooks[].command | select(test("handoff.sh stop"))] | length == 1)' \
            "$target/.claude/settings.json" >/dev/null \
            || { echo "::error::anomaly-scan.sh is not wired exactly once per event, or an existing entry was lost"; exit 1; }
          before="$(md5sum "$target/.claude/settings.json")"
          ./install.sh "$target" --upgrade >/dev/null
          [ "$before" = "$(md5sum "$target/.claude/settings.json")" ] || { echo "::error::a second --upgrade re-wrote settings.json"; exit 1; }
          out3="$(./install.sh "$target" --upgrade --check)"
          echo "$out3" | grep -q "would wire     .claude/settings.json -> Stop" && { echo "::error::--check reported wiring an already-wired hook"; exit 1; }
          true

      - name: --upgrade restores a missing Profile block, at the right position (ADR-005 D4.7)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          awk '/^## Profile$/{skip=1} skip && /<!-- VULYK:PROFILE:END -->/{skip=0; next} !skip' \
            "$target/CLAUDE.md" > "$target/CLAUDE.md.tmp" && mv "$target/CLAUDE.md.tmp" "$target/CLAUDE.md"
          out="$(./install.sh "$target" --upgrade)"
          echo "$out" | grep -q "insert.*CLAUDE.md '## Profile block'" || { echo "::error::--upgrade did not report inserting the Profile block"; exit 1; }
          grep -q '<!-- VULYK:PROFILE:START -->' "$target/CLAUDE.md" || { echo "::error::Profile markers not restored"; exit 1; }
          grep -q '<!-- VULYK:PROFILE:END -->'   "$target/CLAUDE.md" || { echo "::error::Profile markers not restored"; exit 1; }
          count_profile_rows() { awk '/<!-- VULYK:PROFILE:START -->/{f=1;next}/<!-- VULYK:PROFILE:END -->/{f=0}f' "$1" | grep -c '^| '; }
          src_rows="$(count_profile_rows CLAUDE.md)"
          tgt_rows="$(count_profile_rows "$target/CLAUDE.md")"
          [ "$src_rows" = "$tgt_rows" ] || { echo "::error::restored Profile row count mismatch: source=$src_rows target=$tgt_rows"; exit 1; }
          profile_line="$(grep -n '^## Profile$'  "$target/CLAUDE.md" | head -1 | cut -d: -f1)"
          commands_line="$(grep -n '^## Commands$' "$target/CLAUDE.md" | head -1 | cut -d: -f1)"
          [ -n "$profile_line" ] && [ -n "$commands_line" ] && [ "$profile_line" -lt "$commands_line" ] \
            || { echo "::error::## Profile did not land before ## Commands"; exit 1; }
          echo "$out" | grep -q 'profile:.*Client path' || { echo "::error::--upgrade did not name Client path among the still-<fill in> rows"; exit 1; }
          # the row's content, not just its count, must survive the anchor-insert path
          # byte for byte (a second awk pass over an already-escaped `\|` is implementation-
          # defined and would corrupt this row without changing the row count).
          browser_mcp_row="$(grep '| Browser MCP |' CLAUDE.md)"
          grep -qF "$browser_mcp_row" "$target/CLAUDE.md" || { echo "::error::Browser MCP row content differs from source after --upgrade insert"; exit 1; }

      - name: --upgrade restores a missing Commands block before Compact instructions (ADR-005 D4.8)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          awk '/^## Commands$/{skip=1} skip && /<!-- VULYK:COMMANDS:END -->/{skip=0; next} !skip' \
            "$target/CLAUDE.md" > "$target/CLAUDE.md.tmp" && mv "$target/CLAUDE.md.tmp" "$target/CLAUDE.md"
          ./install.sh "$target" --upgrade >/dev/null
          commands_line="$(grep -n '^## Commands$' "$target/CLAUDE.md" | head -1 | cut -d: -f1)"
          compact_line="$(grep -n '^## Compact instructions$' "$target/CLAUDE.md" | head -1 | cut -d: -f1)"
          [ -n "$commands_line" ] && [ -n "$compact_line" ] && [ "$commands_line" -lt "$compact_line" ] \
            || { echo "::error::## Commands did not land before ## Compact instructions"; exit 1; }

      - name: a hand-written Profile heading without markers is warned, not rewritten (ADR-005 D4.9)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          sed -i '/<!-- VULYK:PROFILE:START -->/d; /<!-- VULYK:PROFILE:END -->/d' "$target/CLAUDE.md"
          before="$(cat "$target/CLAUDE.md")"
          out="$(./install.sh "$target" --upgrade)"
          after="$(cat "$target/CLAUDE.md")"
          echo "$out" | grep -q "WARNING.*## Profile exists without VULYK:PROFILE markers" || { echo "::error::missing WARNING for hand-written Profile heading"; exit 1; }
          [ "$before" = "$after" ] || { echo "::error::--upgrade rewrote a hand-written Profile heading"; exit 1; }

      - name: the sidecar constitution gets the same block restored; the foreign CLAUDE.md stays byte-identical (ADR-005 D4.10)
        run: |
          target="$(mktemp -d)"
          printf '# My project rules\n' > "$target/CLAUDE.md"
          ./install.sh "$target" >/dev/null
          test -f "$target/CLAUDE.vulyk.md" || { echo "::error::CLAUDE.vulyk.md fallback missing"; exit 1; }
          foreign_before="$(cat "$target/CLAUDE.md")"
          awk '/^## Profile$/{skip=1} skip && /<!-- VULYK:PROFILE:END -->/{skip=0; next} !skip' \
            "$target/CLAUDE.vulyk.md" > "$target/CLAUDE.vulyk.md.tmp" && mv "$target/CLAUDE.vulyk.md.tmp" "$target/CLAUDE.vulyk.md"
          out="$(./install.sh "$target" --upgrade)"
          foreign_after="$(cat "$target/CLAUDE.md")"
          [ "$foreign_before" = "$foreign_after" ] || { echo "::error::foreign CLAUDE.md was touched while restoring the sidecar"; exit 1; }
          echo "$out" | grep -q "insert.*CLAUDE.vulyk.md '## Profile block'" || { echo "::error::sidecar Profile block was not restored"; exit 1; }
          grep -q '<!-- VULYK:PROFILE:START -->' "$target/CLAUDE.vulyk.md" || { echo "::error::sidecar Profile markers not restored"; exit 1; }

      - name: --upgrade --check after a restore stays dry (ADR-005 D4.11)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          awk '/^## Profile$/{skip=1} skip && /<!-- VULYK:PROFILE:END -->/{skip=0; next} !skip' \
            "$target/CLAUDE.md" > "$target/CLAUDE.md.tmp" && mv "$target/CLAUDE.md.tmp" "$target/CLAUDE.md"
          ./install.sh "$target" --upgrade >/dev/null
          before="$(find "$target" -type f -exec md5sum {} \; | sort | md5sum)"
          out="$(./install.sh "$target" --upgrade --check)"
          after="$(find "$target" -type f -exec md5sum {} \; | sort | md5sum)"
          [ "$before" = "$after" ] || { echo "::error::--upgrade --check after a restore wrote to the target"; exit 1; }

      - name: re-install is idempotent (never overwrites existing files)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          out="$(./install.sh "$target")"
          echo "$out" | grep -q "skip (exists)" || { echo "::error::second install did not skip existing files"; exit 1; }
          echo "$out" | grep -q "left untouched" || { echo "::error::existing VULYK constitution was not preserved"; exit 1; }

      - name: install never overwrites a user's own CLAUDE.md
        run: |
          target="$(mktemp -d)"
          echo "# My project rules" > "$target/CLAUDE.md"
          out="$(./install.sh "$target")"
          echo "$out" | grep -q "CLAUDE.vulyk.md instead" || { echo "::error::foreign CLAUDE.md was not preserved"; exit 1; }
          grep -q "My project rules" "$target/CLAUDE.md" || { echo "::error::foreign CLAUDE.md was overwritten"; exit 1; }
          test -f "$target/CLAUDE.vulyk.md" || { echo "::error::CLAUDE.vulyk.md fallback missing"; exit 1; }
