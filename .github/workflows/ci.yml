name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (real bugs only)
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # Hooks favour portable one-liners (ls|head, etc.); fail only on genuine
          # bugs (severity=error), not style/info nits.
          SHELLCHECK_OPTS: --severity=error
        with:
          scandir: '.'
          additional_files: 'post-merge'

      - name: bash -n (parse check, all scripts)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(find . -type f \( -name '*.sh' -o -path './scripts/git-hooks/*' \) -print0)
          exit $fail

  top-model:
    name: top-model.sh resolves every plan shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: synthetic profiles -> expected alias
        run: |
          t="$(mktemp -d)"; mkdir -p "$t/proj/.claude"
          printf '> Top model policy: `TOP_MODEL = auto`\n' > "$t/proj/CLAUDE.md"
          mk() { printf '{"numStartups":1,"oauthAccount":{"emailAddress":"x@y","organizationType":"%s","organizationRateLimitTier":"%s","seatTier":%s}}\n' "$1" "$2" "$3" > "$t/$4.json"; }
          mk claude_max        default_claude_max_20x   null        max20
          mk claude_max        default_claude_max_5x    null        max5
          mk claude_pro        default_claude_pro       null        pro
          mk claude_team       default_claude_team      '"standard"' teamstd
          mk claude_enterprise default_claude_enterprise '"premium"' entprem
          printf '{"numStartups":1}\n' > "$t/none.json"
          printf 'not json at all\n'   > "$t/garbage.json"
          fail=0
          expect() { # expect <profile> <alias> [env...]
            got="$(env "${@:3}" CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/$1.json" bash scripts/top-model.sh)"
            if [ "$got" = "$2" ]; then echo "  ok    $1 -> $got"; else echo "::error::$1 resolved to '$got', expected '$2'"; fail=1; fi
          }
          expect max20   fable
          expect max5    fable
          expect pro     opus
          expect teamstd opus
          expect entprem fable
          expect none    opus
          expect garbage opus
          expect max20   opus  VULYK_TOP_MODEL=opus
          expect pro     fable VULYK_TOP_MODEL=fable
          # the constitution pin beats the plan; `auto` defers to it
          printf '> Top model policy: `TOP_MODEL = opus`\n' > "$t/proj/CLAUDE.md"
          expect max20 opus
          printf '> Top model policy: `TOP_MODEL = auto`\n' > "$t/proj/CLAUDE.md"
          expect max20 fable
          # --check is red before --apply and green after; --apply merges into an existing file
          CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/max20.json" bash scripts/top-model.sh --check && { echo "::error::--check passed with no pin"; fail=1; }
          printf '{"permissions":{"allow":["Bash(ls:*)"]}}\n' > "$t/proj/.claude/settings.local.json"
          CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/max20.json" bash scripts/top-model.sh --apply
          CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/max20.json" bash scripts/top-model.sh --check || { echo "::error::--check failed after --apply"; fail=1; }
          grep -q '"Bash(ls:\*)"' "$t/proj/.claude/settings.local.json" || { echo "::error::--apply lost the owner's permissions"; fail=1; }
          grep -q '"model": "fable"' "$t/proj/.claude/settings.local.json" || { echo "::error::--apply did not pin fable"; fail=1; }
          # the hook says the same thing in one line, and says nothing where the resolver is absent
          mkdir -p "$t/proj/scripts" && cp scripts/top-model.sh "$t/proj/scripts/"
          line="$(CLAUDE_PROJECT_DIR="$t/proj" VULYK_CLAUDE_CONFIG="$t/pro.json" bash .claude/hooks/top-model-brief.sh)"
          echo "$line" | grep -q '^\[VULYK\] top model: opus' || { echo "::error::hook line wrong: $line"; fail=1; }
          rm "$t/proj/scripts/top-model.sh"
          [ -z "$(CLAUDE_PROJECT_DIR="$t/proj" bash .claude/hooks/top-model-brief.sh)" ] || { echo "::error::hook spoke without a resolver"; fail=1; }
          exit $fail

  cycle:
    name: the cycle's gates - human-check.sh and ship-check.sh through every stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: synthetic spec -> six confirmations, stale on code, current on paperwork
        run: bash tests/cycle.test.sh

  handoff-window:
    name: handoff.py resolves the context window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: synthetic windows -> right denominator, right silence
        run: python3 tests/handoff-window.test.py .claude/hooks/handoff.py

  install-smoke:
    name: install.sh dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install --check into a clean dir is non-destructive and well-formed
        run: |
          target="$(mktemp -d)"
          out="$(./install.sh "$target" --check)"
          echo "$out"
          # dry run must touch nothing
          if [ -n "$(ls -A "$target")" ]; then
            echo "::error::--check wrote files into target (should be dry run)"; exit 1
          fi
          # and must plan to copy the load-bearing pieces
          for needle in ".claude/commands/vulyk-plan.md" ".claude/agents/queen-planner.md" "memory/memory.md"; do
            echo "$out" | grep -q "$needle" || { echo "::error::--check did not plan to copy $needle"; exit 1; }
          done

      - name: real install into a clean dir produces a runnable hive
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          test -f "$target/CLAUDE.md"                          || { echo "::error::CLAUDE.md missing"; exit 1; }
          test -x "$target/.claude/hooks/session-start-brief.sh" || { echo "::error::hooks not executable"; exit 1; }
          test -x "$target/.claude/hooks/top-model-brief.sh"    || { echo "::error::top-model hook missing or not executable"; exit 1; }
          grep -q 'top-model-brief.sh' "$target/.claude/settings.json" || { echo "::error::top-model hook not wired"; exit 1; }
          test -f "$target/memory/stats/skills.json"           || { echo "::error::skills.json not seeded"; exit 1; }

      - name: re-install is idempotent (never overwrites existing files)
        run: |
          target="$(mktemp -d)"
          ./install.sh "$target" >/dev/null
          out="$(./install.sh "$target")"
          echo "$out" | grep -q "skip (exists)" || { echo "::error::second install did not skip existing files"; exit 1; }
          echo "$out" | grep -q "left untouched" || { echo "::error::existing VULYK constitution was not preserved"; exit 1; }

      - name: install never overwrites a user's own CLAUDE.md
        run: |
          target="$(mktemp -d)"
          echo "# My project rules" > "$target/CLAUDE.md"
          out="$(./install.sh "$target")"
          echo "$out" | grep -q "CLAUDE.vulyk.md instead" || { echo "::error::foreign CLAUDE.md was not preserved"; exit 1; }
          grep -q "My project rules" "$target/CLAUDE.md" || { echo "::error::foreign CLAUDE.md was overwritten"; exit 1; }
          test -f "$target/CLAUDE.vulyk.md" || { echo "::error::CLAUDE.vulyk.md fallback missing"; exit 1; }
