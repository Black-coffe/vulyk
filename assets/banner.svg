<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VULYK — hive orchestration for Claude Code">
  <defs>
    <pattern id="hexgrid" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="translate(8,4)">
      <g fill="none" stroke="#1A1610" stroke-width="1">
        <path d="M28 0 L56 16.2 L56 48.5 L28 64.7 L0 48.5 L0 16.2 Z"/>
        <path d="M28 64.7 L56 80.9 L56 113.2 L28 129.4 L0 113.2 L0 80.9 Z" transform="translate(28,-16.2)"/>
      </g>
    </pattern>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B82E"/>
      <stop offset="1" stop-color="#C8861A"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1280" height="320" fill="#0C0A07"/>
  <rect width="1280" height="320" fill="url(#hexgrid)"/>

  <!-- right: the cascade comb — four cells descending in size, F→O→S→H -->
  <g transform="translate(985,42)" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" text-anchor="middle">
    <!-- connective hairlines -->
    <g stroke="#5C5546" stroke-width="1">
      <line x1="0" y1="46" x2="-52" y2="92"/>
      <line x1="0" y1="46" x2="52" y2="92"/>
      <line x1="-52" y1="128" x2="-92" y2="170"/>
      <line x1="52" y1="128" x2="92" y2="170"/>
      <line x1="-52" y1="128" x2="0" y2="170"/>
      <line x1="52" y1="128" x2="0" y2="170"/>
    </g>
    <!-- TOP: queen cell -->
    <g>
      <path d="M0 0 L40 23 L40 69 L0 92 L-40 69 L-40 23 Z" fill="url(#honey)"/>
      <text x="0" y="56" font-size="30" font-weight="bold" fill="#0C0A07">F</text>
    </g>
    <!-- LEADS: two opus cells -->
    <g transform="translate(-52,92)">
      <path d="M0 0 L31 18 L31 54 L0 72 L-31 54 L-31 18 Z" fill="none" stroke="#F5B82E" stroke-width="2.5"/>
      <text x="0" y="45" font-size="24" font-weight="bold" fill="#F5B82E">O</text>
    </g>
    <g transform="translate(52,92)">
      <path d="M0 0 L31 18 L31 54 L0 72 L-31 54 L-31 18 Z" fill="none" stroke="#F5B82E" stroke-width="2.5"/>
      <text x="0" y="45" font-size="24" font-weight="bold" fill="#F5B82E">O</text>
    </g>
    <!-- WORKERS: three sonnet cells -->
    <g transform="translate(-92,170)">
      <path d="M0 0 L24 14 L24 42 L0 56 L-24 42 L-24 14 Z" fill="none" stroke="#C8861A" stroke-width="1.8"/>
      <text x="0" y="36" font-size="19" fill="#C8861A">S</text>
    </g>
    <g transform="translate(0,170)">
      <path d="M0 0 L24 14 L24 42 L0 56 L-24 42 L-24 14 Z" fill="none" stroke="#C8861A" stroke-width="1.8"/>
      <text x="0" y="36" font-size="19" fill="#C8861A">S</text>
    </g>
    <g transform="translate(92,170)">
      <path d="M0 0 L24 14 L24 42 L0 56 L-24 42 L-24 14 Z" fill="none" stroke="#C8861A" stroke-width="1.8"/>
      <text x="0" y="36" font-size="19" fill="#C8861A">S</text>
    </g>
    <!-- DRONES: row of haiku cells -->
    <g transform="translate(0,226)">
      <g stroke="#5C5546" stroke-width="1.4" fill="none">
        <path transform="translate(-120,14)" d="M0 0 L15 9 L15 27 L0 36 L-15 27 L-15 9 Z"/>
        <path transform="translate(-60,14)" d="M0 0 L15 9 L15 27 L0 36 L-15 27 L-15 9 Z"/>
        <path transform="translate(0,14)" d="M0 0 L15 9 L15 27 L0 36 L-15 27 L-15 9 Z"/>
        <path transform="translate(60,14)" d="M0 0 L15 9 L15 27 L0 36 L-15 27 L-15 9 Z"/>
        <path transform="translate(120,14)" d="M0 0 L15 9 L15 27 L0 36 L-15 27 L-15 9 Z"/>
      </g>
      <g font-size="14" fill="#5C5546">
        <text x="-120" y="37">H</text>
        <text x="-60" y="37">H</text>
        <text x="0" y="37">H</text>
        <text x="60" y="37">H</text>
        <text x="120" y="37">H</text>
      </g>
    </g>
  </g>

  <!-- left: wordmark block -->
  <g transform="translate(84,0)">
    <text x="0" y="92" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#5C5546" letter-spacing="6">ВУЛИК · BEEHIVE</text>
    <text x="-6" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="96" font-weight="bold" fill="#E8DFCB" letter-spacing="14">V<tspan fill="url(#honey)">U</tspan>LYK</text>
    <text x="0" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#9A917D">Hive orchestration for Claude Code — cascade, memory, evolution.</text>
    <!-- terminal hairline -->
    <line x1="0" y1="252" x2="640" y2="252" stroke="#1A1610" stroke-width="1"/>
    <text x="0" y="280" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" fill="#F5B82E">$ /vulyk-plan <tspan fill="#9A917D">"ship the feature"</tspan> <tspan fill="#5C5546">·</tspan> <tspan fill="#C8861A">queen plans · workers build</tspan></text>
  </g>
</svg>
