<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" role="img" aria-label="VULYK 0.18 architecture: the Queen builds Tier 0-2 solo with one reviewer; Tier 3-4 runs workers in waves through the Workflow driver and a council; both share cycle.sh state on disk and the memory plane">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5C5546"/>
    </marker>
  </defs>
  <rect width="1180" height="720" fill="#0C0A07"/>

  <!-- title -->
  <text x="120" y="42" font-size="14" fill="#5C5546" letter-spacing="3">VULYK · ARCHITECTURE · 0.18</text>

  <!-- ====== left margin: what each row does, on which model ====== -->
  <g font-size="12" fill="#5C5546" letter-spacing="2">
    <text x="36" y="118">PLAN</text>
    <text x="36" y="124" dy="14" fill="#3A3528">opus 5.5</text>
    <text x="36" y="262">BUILD</text>
    <text x="36" y="268" dy="14" fill="#3A3528">opus 5.5</text>
    <text x="36" y="392">JUDGE</text>
    <text x="36" y="398" dy="14" fill="#3A3528">opus</text>
    <text x="36" y="412" dy="14" fill="#3A3528">gate T4</text>
    <text x="36" y="502">STATE</text>
    <text x="36" y="508" dy="14" fill="#3A3528">on disk</text>
    <text x="36" y="598">SENSE</text>
    <text x="36" y="604" dy="14" fill="#3A3528">opus low</text>
  </g>
  <line x1="120" y1="60" x2="120" y2="640" stroke="#1A1610" stroke-width="1"/>

  <!-- ====== QUEEN ====== -->
  <g transform="translate(400,80)">
    <rect x="0" y="0" width="330" height="84" rx="10" fill="none" stroke="#F5B82E" stroke-width="2.5"/>
    <path d="M165 -16 L183 -6 L183 14 L165 24 L147 14 L147 -6 Z" fill="#F5B82E"/>
    <text x="165" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#E8DFCB">QUEEN</text>
    <text x="165" y="58" text-anchor="middle" font-size="12" fill="#9A917D">main session · plans, routes, integrates</text>
    <text x="165" y="75" text-anchor="middle" font-size="11" fill="#C8861A">builds Tier 0–2 herself · approval stop</text>
  </g>

  <!-- queen -> the two paths -->
  <g stroke="#5C5546" stroke-width="1.3" fill="none">
    <path d="M500 164 C 500 205, 240 190, 240 226" marker-end="url(#arr)"/>
    <path d="M630 164 C 630 205, 680 190, 680 226" marker-end="url(#arr)"/>
  </g>
  <g font-size="11.5" fill="#C8861A">
    <text x="165" y="200">SOLO · Tier 0–2</text>
    <text x="700" y="200">HIVE · Tier 3–4</text>
  </g>

  <!-- ====== SOLO lane: build ====== -->
  <g transform="translate(150,230)">
    <rect width="180" height="70" rx="10" fill="none" stroke="#F5B82E" stroke-width="1.8"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#E8DFCB">the Queen</text>
    <text x="90" y="46" text-anchor="middle" font-size="10.5" fill="#9A917D">builds story by story</text>
    <text x="90" y="61" text-anchor="middle" font-size="10" fill="#5C5546">no driver · no clerk</text>
  </g>
  <g transform="translate(360,230)">
    <rect width="180" height="70" rx="10" fill="none" stroke="#F5B82E" stroke-width="1.8"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#E8DFCB">close-story</text>
    <text x="90" y="46" text-anchor="middle" font-size="10.5" fill="#9A917D">verification runs once</text>
    <text x="90" y="61" text-anchor="middle" font-size="10" fill="#5C5546">one 540 s budget · commit</text>
  </g>
  <path d="M330 265 H356" stroke="#5C5546" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <!-- ====== HIVE lane: build ====== -->
  <g transform="translate(590,230)">
    <rect width="180" height="70" rx="10" fill="none" stroke="#F5B82E" stroke-width="1.8"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#E8DFCB">Workflow driver</text>
    <text x="90" y="46" text-anchor="middle" font-size="10.5" fill="#9A917D">vulyk-cycle.js</text>
    <text x="90" y="61" text-anchor="middle" font-size="10" fill="#5C5546">1 clerk per agent boundary</text>
  </g>
  <g transform="translate(800,230)">
    <rect width="180" height="70" rx="10" fill="none" stroke="#F5B82E" stroke-width="1.8"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#E8DFCB">worker-code ×N</text>
    <text x="90" y="46" text-anchor="middle" font-size="10.5" fill="#9A917D">one story each, in waves</text>
    <text x="90" y="61" text-anchor="middle" font-size="10" fill="#5C5546">closes its own story</text>
  </g>
  <path d="M770 265 H796" stroke="#5C5546" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <!-- build -> judge -->
  <g stroke="#5C5546" stroke-width="1.3" fill="none">
    <path d="M450 300 V346" marker-end="url(#arr)"/>
    <path d="M890 300 V346" marker-end="url(#arr)"/>
  </g>

  <!-- ====== SOLO lane: one reviewer ====== -->
  <g transform="translate(150,350)">
    <rect width="390" height="92" rx="10" fill="none" stroke="#F5B82E" stroke-width="1.8"/>
    <text x="195" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#E8DFCB">lead-review</text>
    <text x="195" y="47" text-anchor="middle" font-size="11" fill="#9A917D">one fresh-context reviewer per round · opus</text>
    <text x="195" y="64" text-anchor="middle" font-size="11" fill="#9A917D">judges the asks and correctness, nothing else</text>
    <text x="195" y="81" text-anchor="middle" font-size="10.5" fill="#5C5546">BLOCK only when anchored: [ask N] or [regression]</text>
  </g>

  <!-- ====== HIVE lane: the council ====== -->
  <g transform="translate(590,350)">
    <rect width="390" height="92" rx="10" fill="none" stroke="#F5B82E" stroke-width="1.8"/>
    <text x="195" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#E8DFCB">council</text>
    <text x="195" y="47" text-anchor="middle" font-size="11" fill="#9A917D">council-opus: intent, from a blind court</text>
    <text x="195" y="64" text-anchor="middle" font-size="11" fill="#9A917D">lead-review on the diff · council-haiku</text>
    <text x="195" y="81" text-anchor="middle" font-size="10.5" fill="#5C5546">only with a Client path · Tier 4 adds the gate model</text>
  </g>

  <!-- judge -> state -->
  <g stroke="#5C5546" stroke-width="1.3" fill="none">
    <path d="M345 442 V476" marker-end="url(#arr)"/>
    <path d="M785 442 V476" marker-end="url(#arr)"/>
  </g>

  <!-- ====== STATE: cycle.sh, shared by both paths ====== -->
  <g transform="translate(150,480)">
    <rect width="810" height="62" rx="10" fill="#110E09" stroke="#C8861A" stroke-width="1.5"/>
    <text x="18" y="25" font-size="13" font-weight="bold" fill="#E8DFCB">scripts/cycle.sh</text>
    <text x="168" y="25" font-size="11.5" fill="#9A917D">state on disk · advance runs every mechanical step up to the next agent</text>
    <text x="18" y="47" font-size="10.5" fill="#5C5546">GREEN seats carry forward · round 2+ reviews only the repair diff · RED → a mechanical repair story ↺ · ceilings 1 / 2 / 3</text>
  </g>

  <!-- ====== SENSE: support agents ====== -->
  <text x="150" y="570" font-size="10.5" fill="#5C5546">support · opus at low effort · no constitution loaded (omitClaudeMd)</text>
  <g transform="translate(150,580)">
    <rect width="250" height="52" rx="10" fill="none" stroke="#5C5546" stroke-width="1.3"/>
    <text x="125" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8DFCB">drone-scout</text>
    <text x="125" y="41" text-anchor="middle" font-size="10.5" fill="#9A917D">broad recon, map-format reports</text>
  </g>
  <g transform="translate(430,580)">
    <rect width="250" height="52" rx="10" fill="none" stroke="#5C5546" stroke-width="1.3"/>
    <text x="125" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8DFCB">drone-docs</text>
    <text x="125" y="41" text-anchor="middle" font-size="10.5" fill="#9A917D">refreshes the map after a merge</text>
  </g>
  <g transform="translate(710,580)">
    <rect width="250" height="52" rx="10" fill="none" stroke="#5C5546" stroke-width="1.3"/>
    <text x="125" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8DFCB">librarian</text>
    <text x="125" y="41" text-anchor="middle" font-size="10.5" fill="#9A917D">consolidates memory · gc</text>
  </g>

  <!-- ====== MEMORY PLANE (right rail) ====== -->
  <g transform="translate(1006,80)">
    <rect x="0" y="0" width="150" height="560" rx="10" fill="#110E09" stroke="#1A1610"/>
    <text x="75" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#F5B82E" letter-spacing="2">MEMORY</text>
    <text x="75" y="46" text-anchor="middle" font-size="10.5" fill="#5C5546">lives in git</text>
    <g font-size="11" fill="#9A917D" text-anchor="middle">
      <text x="75" y="84">CLAUDE.md</text>
      <text x="75" y="99" fill="#5C5546" font-size="9.5">7 KB constitution</text>
      <text x="75" y="138">.claude/rules/</text>
      <text x="75" y="153" fill="#5C5546" font-size="9.5">path-scoped</text>
      <text x="75" y="192">memory.md</text>
      <text x="75" y="207" fill="#5C5546" font-size="9.5">pointer index</text>
      <text x="75" y="246">memory/map/</text>
      <text x="75" y="261" fill="#5C5546" font-size="9.5">codebase map</text>
      <text x="75" y="300">docs/specs/</text>
      <text x="75" y="315" fill="#5C5546" font-size="9.5">specs · rounds</text>
      <text x="75" y="354">docs/adr/</text>
      <text x="75" y="369" fill="#5C5546" font-size="9.5">decisions</text>
      <text x="75" y="408">docs/wiki/</text>
      <text x="75" y="423" fill="#5C5546" font-size="9.5">domain notes</text>
      <text x="75" y="462">stats/</text>
      <text x="75" y="477" fill="#5C5546" font-size="9.5">council ledger</text>
      <text x="75" y="516">token-report</text>
      <text x="75" y="531" fill="#5C5546" font-size="9.5">real spend per spec</text>
    </g>
  </g>
  <!-- memory exchange -->
  <g stroke="#3A3528" stroke-width="1.2" fill="none">
    <path d="M730 122 H1006"/>
    <path d="M960 511 H1006"/>
    <path d="M960 606 H1006"/>
  </g>
  <g fill="#3A3528" font-size="9.5">
    <text x="966" y="116">read</text>
    <text x="968" y="505">write</text>
    <text x="968" y="600">write</text>
  </g>

  <!-- ====== bottom: evolution loop ====== -->
  <g transform="translate(120,668)">
    <line x1="0" y1="0" x2="1036" y2="0" stroke="#1A1610"/>
    <text x="0" y="28" font-size="12" fill="#C8861A">↻ /vulyk-evolve</text>
    <text x="136" y="28" font-size="11.5" fill="#5C5546">token spend + the council ledger → config diffs on a branch → human review → the hive adapts. Nothing self-applies.</text>
  </g>
</svg>
